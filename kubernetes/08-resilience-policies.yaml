apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-pdb
  namespace: tickets
  labels:
    app: inventory
    resilience-pattern: redundancy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: inventory

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reservations-pdb
  namespace: tickets
  labels:
    app: reservations
    resilience-pattern: redundancy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: reservations

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: tickets
  labels:
    app: gateway
    resilience-pattern: redundancy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: tickets
  labels:
    app: gateway
    resilience-pattern: overload-protection
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
